<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIポートフォリオ v6｜AIで作ったロゴ・ページ・アプリ</title>
<meta name="description" content="AIで設計・書き出ししたロゴ・ページ・アプリUIの実績集（試作v6：ヒーロー全面に作品が流れ、ロゴ・タイトルを重ねる）。">
<meta property="og:type" content="website">
<meta property="og:title" content="AIポートフォリオ v6｜AIで作ったロゴ・ページ・アプリ">
<meta property="og:description" content="ChatGPT・Claudeなどを使い分けて作ったデザイン実績。作品ごとに使用AIを記載。">
<meta property="og:url" content="https://yukitchy.github.io/ai-portfolio/v6.html">
<meta property="og:image" content="https://yukitchy.github.io/ai-portfolio/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="common.css">
<style>
.card{display:flex;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);align-items:center}
.card .tl{flex:0 0 80px;width:80px}
.card .th{border-radius:3px;border:1px solid var(--line)}
.card .b{min-width:0;flex:1}

.hero{position:relative;height:clamp(196px,56vw,300px);overflow:hidden;background:var(--ink)}
.hero .flow{position:absolute;inset:0;--g:4px;--dur:110s}
.hero .tr,.hero .fi{height:100%}
.hero .fi{width:auto;aspect-ratio:16/10}
.hero .flow .th{height:100%;border-radius:0}
.hero .ph span{font-size:18px}.hero .ph small{font-size:11px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(20,18,23,.62),rgba(20,18,23,.1) 38%,rgba(20,18,23,.2) 55%,rgba(20,18,23,.82))}
.hero header{position:relative;z-index:2;border:0}
.hero .site{color:#fff;font-weight:400}
.hc{position:absolute;z-index:2;left:12px;right:12px;bottom:14px;color:#fff;font-weight:800;font-size:clamp(21px,6.6vw,30px);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc small{display:block;font-size:12px;font-weight:400;letter-spacing:.24em;opacity:.85;margin-bottom:2px}
</style>
</head>
<body class="v6">
<div class="wrap">
<div class="hero"><div class="flow" aria-hidden="true"></div><header><a class="hd" href="./v6.html"><img src="assets/icon.png" alt="" width="32" height="32"><span class="site">AIポートフォリオ</span></a><button type="button" class="cta" aria-haspopup="dialog">仕事の相談</button></header><p class="hc"><small>AIで作った</small>ロゴ・ページ・アプリ</p></div>
<p class="proto"><span class="note">試作版：作品データはサンプルです</span></p>
<section class="works"><h2>作品<small><span id="count">–</span>件</small></h2><div class="filters"><div class="row" id="catRow" aria-label="種類で絞り込む"></div></div><ul class="list" id="list"></ul>
<p id="empty">この種類の作品はまだありません。</p></section>
<section id="profile" class="prof"><h2>プロフィール</h2><p class="pn" id="pName"></p><p class="pr" id="pRole"></p><p class="pb" id="pBio"></p></section>
<section id="contact" class="ct"><h2>お問い合わせ</h2><p class="cl">ロゴ1点から、ページ・アプリ画面まで相談できます。</p><button type="button" class="btn" id="pContact" aria-haspopup="dialog">仕事の相談をする</button><p class="cn" id="pNote"></p></section>
<footer>AIポートフォリオ 試作 v6 ／ 作品データはサンプルです ／ <a href="board.html">見比べボードに戻る</a></footer>
</div>
<script>window.T={card:(it,i)=>`<li class="card${i===0?" first":""}"><span class="tl">${thumb(it)}</span><div class="b">${link(it,esc(it.title),"t")}<p class="d">${esc(it.desc)}</p>${tags(it)}</div></li>`};</script>
<script src="app.js"></script>
</body>
</html>
