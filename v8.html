<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIポートフォリオ v8｜AIで作ったロゴ・ページ・アプリ</title>
<meta name="description" content="AIで設計・書き出ししたロゴ・ページ・アプリUIの実績集（試作v8：2段のサムネが上下で逆方向に流れる）。">
<meta property="og:type" content="website">
<meta property="og:title" content="AIポートフォリオ v8｜AIで作ったロゴ・ページ・アプリ">
<meta property="og:description" content="ChatGPT・Claudeなどを使い分けて作ったデザイン実績。作品ごとに使用AIを記載。">
<meta property="og:url" content="https://yukitchy.github.io/ai-portfolio/v8.html">
<meta property="og:image" content="https://yukitchy.github.io/ai-portfolio/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="common.css">
<style>
.card{display:flex;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);align-items:center}
.card .tl{flex:0 0 80px;width:80px}
.card .th{border-radius:3px;border:1px solid var(--line)}
.card .b{min-width:0;flex:1}

.duo{background:var(--vio-l);padding:10px 0;display:grid;gap:8px}
.duo .flow{--w:124px;--g:8px;--dur:100s}
.duo .th{border-radius:4px;box-shadow:0 1px 3px rgba(40,20,90,.12)}
</style>
</head>
<body class="v8">
<div class="wrap">
<header><a class="hd" href="./v8.html"><img src="assets/icon.png" alt="" width="32" height="32"><span class="site">AIポートフォリオ</span></a><a class="cta" href="#contact">仕事の相談</a></header><div class="duo" aria-hidden="true"><div class="flow"></div><div class="flow rev"></div></div>
<p class="proto"><span class="note">試作版：作品データはサンプルです</span></p>
<section class="works"><h2>作品<small><span id="count">–</span>件</small></h2><div class="filters"><div class="row" id="catRow" aria-label="種類で絞り込む"></div></div><ul class="list" id="list"></ul>
<p id="empty">この種類の作品はまだありません。</p></section>
<section id="profile" class="prof"><h2>プロフィール</h2><p class="pn" id="pName"></p><p class="pr" id="pRole"></p><p class="pb" id="pBio"></p></section>
<section id="contact" class="ct"><h2>お問い合わせ</h2><p class="cl">ロゴ1点から、ページ・アプリ画面まで相談できます。</p><a class="btn" id="pContact" href="#contact">仕事の相談をする</a><p class="cn" id="pNote"></p></section>
<footer>AIポートフォリオ 試作 v8 ／ 作品データはサンプルです ／ <a href="./">見比べボードに戻る</a></footer>
</div>
<script>window.T={card:(it,i)=>`<li class="card${i===0?" first":""}"><span class="tl">${thumb(it)}</span><div class="b">${link(it,esc(it.title),"t")}<p class="d">${esc(it.desc)}</p>${tags(it)}</div></li>`};</script>
<script src="app.js"></script>
</body>
</html>
