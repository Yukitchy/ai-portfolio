<!doctype html><meta charset="utf-8"><title>selftest</title><body><pre id="out">running</pre>
<script>
// 自己検査：本採用トップ(index)＋見比べボード(board)＋v1〜v10 それぞれで 320/390幅のはみ出し・見出し1行・丸ゴシック、v1〜v5で絞り込み・0件空表示・タグ・リンク・ロゴ/OG/favicon を確認
const out=[],ok=(c,m)=>out.push((c?"PASS ":"FAIL ")+m);
const load=(p,w)=>new Promise(r=>{const f=document.createElement("iframe");f.style.cssText=`width:${w}px;height:800px;border:0`;f.src=p;f.onload=()=>setTimeout(()=>r(f.contentWindow),1200);document.body.append(f)});
const B="https://yukitchy.github.io/ai-portfolio/";
(async()=>{
 for(const v of ["board","index",...Array.from({length:10},(_,i)=>"v"+(i+1))]){
  for(const w of [320,390]){
    const win=await load(`${v}.html`,w),d=win.document;
    const over=[...d.querySelectorAll("body *")].filter(e=>e.getBoundingClientRect().right>w+0.5&&!e.closest(".row,.flow")).map(e=>e.className||e.tagName).slice(0,3);
    ok(d.documentElement.scrollWidth<=w&&!over.length,`${v} ${w}px 横はみ出しなし (scrollWidth=${d.documentElement.scrollWidth}${over.length?" 犯人:"+over:""})`);
    const h=[...d.querySelectorAll("h1,h2,h3")].filter(x=>x.offsetParent);
    const bad=h.filter(x=>x.scrollWidth>x.clientWidth+1||(cs=>(x.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom))/parseFloat(cs.lineHeight)>(x.querySelector(".site")?2.6:1.5))(getComputedStyle(x)));
    ok(!bad.length,`${v} ${w}px 見出し${h.length}本すべて1行${bad.length?" NG:"+bad.map(x=>x.textContent):""}`);
    ok(!/maru|rounded|丸/i.test([...d.querySelectorAll("*")].map(e=>getComputedStyle(e).fontFamily).join()),`${v} ${w}px 丸ゴシック不使用`);
    if(w!==390)continue;
    const self=v==="index"?B:`${B}${v}.html`,top=v==="index";
    ok(d.querySelector('link[rel=icon]').href.endsWith("favicon.png")&&d.querySelector('link[rel=apple-touch-icon]').href.endsWith("assets/apple-touch-icon.png")&&d.querySelector('meta[property="og:image"]').content===B+({board:"og-board2.png",index:"og-final.png"}[v]||"og.png")&&d.querySelector('meta[property="og:url"]').content===self,`${v} favicon/apple-touch/og:image/og:url=${self}`);
    const logo=d.querySelector("header img");ok(logo&&logo.complete&&logo.naturalWidth===256&&/assets\/icon\.png$/.test(logo.src),`${v} ヘッダーロゴ＝確定アイコン ${logo&&logo.src.split("/").pop()}`);
    if(v==="board"){
      const links=[...d.querySelectorAll(".grid a")].map(a=>a.getAttribute("href"));ok(links.join()==="v6.html,v7.html,v8.html,v9.html,v10.html,v1.html,v2.html,v3.html,v4.html,v5.html",`board 10案リンク ${links}`);
      const sh=[...d.querySelectorAll(".sh img")];ok(sh.length===10&&sh.every(i=>i.complete&&i.naturalWidth===390&&i.naturalHeight===844),`board スクショ10枚 390×844`);
      continue;
    }
    ok(/AIポートフォリオ/.test(d.querySelector("header").textContent),`${v} ヘッダーにサイト名`);
    const hh=d.querySelector("header").offsetHeight;ok(hh<=50,`${v} 薄いヘッダー ${hh}px`);
    ok(d.querySelector('header a.cta[href="#contact"]'),`${v} ヘッダーに相談導線`);
    const ts=[...d.querySelectorAll("#list .card .t")].filter(x=>!x.closest(".first"));ok(ts.every(x=>x.getClientRects().length===1&&x.offsetHeight<=24),`${v} 作品タイトル1行`);
    if(top){const o=[...d.querySelectorAll("header,.works>h2,.filters,.duo,#list")].map(e=>e.getBoundingClientRect().top);ok(o.length===5&&o.every((t,i)=>!i||t>o[i-1]),`index 並び＝ヘッダー→作品見出し→絞り込み→流れ→リスト`);ok(!/試作|サンプル/.test(d.body.textContent),`index 試作・サンプル表記なし`);}
    if(top||+v.slice(1)>=6){const fl=[...d.querySelectorAll(".flow")],ims=fl.flatMap(f=>[...f.querySelectorAll("img")]);
      ok(fl.length&&fl.every(f=>{const r=f.getBoundingClientRect(),t=f.querySelector(".tr");return r.left>=0&&r.right<=w+0.5&&getComputedStyle(f).overflowX==="hidden"&&t.scrollWidth>=2*w&&parseFloat(getComputedStyle(t).animationDuration)>=90&&getComputedStyle(t).animationTimingFunction==="linear"}),`${v} 流れ${fl.length}段：枠内に収まり・幅を埋め・1周90秒以上の等速`);if(top)ok(fl.length===1,`index 流れは1段`);if(top){const im=fl[0].querySelector("img").getBoundingClientRect();ok(Math.abs(im.width-248)<1&&Math.abs(im.height-155)<1,`index 流れのサムネは2倍サイズ ${im.width}×${im.height}px（旧124×77.5）`);}
      ok(ims.length&&ims.every(i=>/^thumbs\//.test(i.getAttribute("src"))&&i.complete&&i.naturalWidth>0)&&!fl.some(f=>f.querySelector(".ph")),`${v} 流れは実スクショ${new Set(ims.map(i=>i.getAttribute("src"))).size}種のみ（仮サムネなし）`);
      ok([...d.styleSheets].some(ss=>[...ss.cssRules].some(r=>r.media&&/prefers-reduced-motion/.test(r.media.mediaText))),`${v} prefers-reduced-motionで停止`);}
    if(v==="v3"){const c=[...d.querySelectorAll("#list .card")];ok(c[9].getBoundingClientRect().top<844,`v3 10作品目が1画面(844)内 top=${Math.round(c[9].getBoundingClientRect().top)}`);}
    // 期待値は data.json から数える（件数を手で書かない）
    const n=()=>d.querySelectorAll("#list .card").length,click=s=>d.querySelector(s).click(),ALL=win.APP.items,withAI=ALL.filter(i=>i.ai.length),cnt=c=>ALL.filter(i=>i.scope.includes(c)).length;
    ok(ALL.length===139&&n()===ALL.length&&d.querySelector("#count").textContent==="139"&&cnt("ロゴ")===22&&cnt("ページ")===47&&cnt("アプリ")===70,`${v} すべて → ${n()}件（件数表示 ${d.querySelector("#count")&&d.querySelector("#count").textContent}）`);
    const sN=ALL.reduce((a,i)=>a+i.scope.length,0),aN=withAI.reduce((a,i)=>a+i.ai.length,0);
    ok(d.querySelectorAll("#list .scope").length===sN&&d.querySelectorAll("#list .ai").length===aN,`${v} 担当タグ${d.querySelectorAll("#list .scope").length}/${sN}・使用AIタグ${d.querySelectorAll("#list .ai").length}/${aN}`);
    ok([...d.querySelectorAll("#list .card")].every((c,i)=>{const t=c.querySelector(".tags");return t&&t.querySelectorAll(".scope").length===ALL[i].scope.length&&t.querySelectorAll(".ai").length===ALL[i].ai.length})&&![...d.querySelectorAll("#list .scope,#list .ai")].some(x=>!x.textContent.trim()),`${v} 全${ALL.length}件にカテゴリタグ・AI不明${ALL.length-withAI.length}件はAIタグなし・空チップなし`);
    const sc=getComputedStyle(d.querySelector(".scope")),ai=getComputedStyle(d.querySelector(".ai"));ok((sc.backgroundColor!==ai.backgroundColor||sc.borderTopStyle!==ai.borderTopStyle)&&ai.borderTopStyle==="solid"&&getComputedStyle(d.querySelector(".ai"),"::before").content.includes("AI"),`${v} 使用AIタグは担当タグと別の見た目`);
    ok(d.querySelectorAll("#list img.th").length===ALL.filter(i=>i.thumb).length&&d.querySelectorAll("#list .ph").length===ALL.filter(i=>!i.thumb).length&&[...d.querySelectorAll("#list .ph")].every(p=>/仮サムネ/.test(p.textContent)),`${v} 実スクショ${d.querySelectorAll("#list img.th").length}・仮サムネ${d.querySelectorAll("#list .ph").length}（仮表示あり）`);
    const cards=[...d.querySelectorAll("#list .card")],its=win.APP.items;
    ok(cards.every((c,i)=>{const a=c.querySelectorAll("a");return its[i].url?(a.length===1&&a[0].getAttribute("href")===its[i].url&&a[0].target==="_blank"&&a[0].rel==="noopener"):a.length===0}),`${v} 各カードのリンク＝data.jsonのurl（なしは0本・_blank/noopener）`);
    ok(its.filter(i=>i.url).length===70&&!its.find(i=>i.id===5).url,`${v} URLあり70作品・だんどりーはリンクなし`);
    ok(cards.every((c,i)=>{c.scrollIntoView({block:"center"});const th=c.querySelector(".th").getBoundingClientRect(),hit=d.elementFromPoint(th.left+th.width/2,th.top+th.height/2),a=hit&&hit.closest("a");return its[i].url?a&&a.getAttribute("href")===its[i].url:!a}),`${v} サムネ部分を押してもその作品へ飛ぶ`);win.scrollTo(0,0);
    for(const[c,k]of[["ロゴ",cnt("ロゴ")],["ページ",cnt("ページ")],["アプリ",cnt("アプリ")]]){click(`[data-cat="${c}"]`);{const want=ALL.filter(i=>i.scope.includes(c));ok(n()===k&&[...d.querySelectorAll("#list .card")].every((x,j)=>x.querySelector(".t").textContent===want[j].title),`${v} ${c} → ${n()}件（並びもdata.jsonどおり）`);}}
    ok(d.querySelector('[data-cat="アプリ"]').getAttribute("aria-pressed")==="true"&&d.querySelector('[data-cat=""]').getAttribute("aria-pressed")==="false",`${v} 押したチップだけ選択状態`);
    win.APP.items=win.APP.items.filter(i=>!i.scope.includes("アプリ"));win.APP.render();
    ok(n()===0&&d.querySelector("#empty").style.display==="block",`${v} アプリ0件のとき空表示`);
    click('[data-cat=""]');ok(n()===ALL.length-cnt("アプリ")&&d.querySelector("#empty").style.display==="none",`${v} すべてに戻すと空表示が消える`);
    ok(d.querySelector("#pName").textContent==="市原佑樹（Anime Sensei）"&&d.querySelector("#pContact").getAttribute("href")==="#contact"&&d.querySelector("#contact"),`${v} プロフィール名(data.json)と問い合わせ導線`);
    if(!top)ok(d.querySelector('a[href="board.html"]'),`${v} ボードへ戻るリンク`);
    if(top){win.APP.items=(await (await win.fetch("data.json")).json()).items;const F0=win.APP.items;
      const fsrc=()=>[...new Set([...d.querySelectorAll(".flow img")].map(i=>i.getAttribute("src")))].sort().join(),lsrc=()=>[...d.querySelectorAll("#list .card")].map(c=>{const i=c.querySelector("img.th");return i?i.getAttribute("src"):"ph"}).join();
      const LG=F0.filter(i=>i.scope.includes("ロゴ")).map(i=>i.thumbs["ロゴ"]).join(),LGS=LG.split(",").sort().join();
      click('[data-cat="ロゴ"]');await new Promise(r=>setTimeout(r,600));
      ok(LG.split(",").length===22&&lsrc()===LG&&[...d.querySelectorAll("#list img.th")].every(i=>i.complete&&i.naturalWidth===800),`index ロゴ → リスト${lsrc().split(",").length}件ともロゴ画像`);
      ok(fsrc()===LGS&&!d.querySelector(".flow .ph"),`index ロゴ → 流れもロゴ画像だけ ${fsrc().split(",").length}種`);
      const F=win.APP.items,exp=c=>F.filter(i=>!c||i.scope.includes(c)).map(i=>(c&&i.thumbs&&i.thumbs[c])||i.thumb||"ph"),ex=c=>exp(c).join(),ef=c=>[...new Set(exp(c).filter(x=>x!=="ph"))].sort().join();
      click('[data-cat="ページ"]');ok(lsrc()===ex("ページ")&&fsrc()===ef("ページ")&&!d.querySelector(".flow .ph"),`index ページ → サイトのスクショ${exp("ページ").length}件・流れ${fsrc().split(",").length}種（仮サムネなし）`);
      click('[data-cat="アプリ"]');ok(lsrc()===ex("アプリ")&&fsrc()===ef("アプリ")&&!d.querySelector(".flow .ph"),`index アプリ → アプリ画面${exp("アプリ").length}件・流れは実画像${fsrc().split(",").length}種のみ`);
      click('[data-cat=""]');ok(fsrc()===ef("")&&!fsrc().includes("logo-"),`index すべて → 流れは代表スクショ${fsrc().split(",").length}種`);
      const t=d.querySelector(".flow .tr"),px=t.scrollWidth/2/parseFloat(getComputedStyle(t).animationDuration);ok(px<=12,`index 139件でも流れる速さは据え置き ${px.toFixed(1)}px/秒`);}
  }
  document.querySelectorAll("iframe").forEach(f=>f.remove());
 }
 document.getElementById("out").textContent=out.join("\n");
 document.title="done";
})();
</script>
