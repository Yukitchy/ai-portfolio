<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIポートフォリオ v9｜AIで作ったロゴ・ページ・アプリ</title>
<meta name="description" content="AIで設計・書き出ししたロゴ・ページ・アプリUIの実績集（試作v9：淡く沈めた流れの上に大きな文字組だけを置く）。">
<meta property="og:type" content="website">
<meta property="og:title" content="AIポートフォリオ v9｜AIで作ったロゴ・ページ・アプリ">
<meta property="og:description" content="ChatGPT・Claudeなどを使い分けて作ったデザイン実績。作品ごとに使用AIを記載。">
<meta property="og:url" content="https://yukitchy.github.io/ai-portfolio/v9.html">
<meta property="og:image" content="https://yukitchy.github.io/ai-portfolio/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon-ai.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon-ai.png">
<link rel="stylesheet" href="common.css">
<style>
.card{display:flex;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);align-items:center}
.card .tl{flex:0 0 80px;width:80px}
.card .th{border-radius:3px;border:1px solid var(--line)}
.card .b{min-width:0;flex:1}

.type{position:relative;overflow:hidden;padding:30px 14px 26px}
.type .flow{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);--w:210px;--g:10px;--dur:120s;filter:grayscale(1)}
.type::before{content:"";position:absolute;inset:0;z-index:1;background:rgba(255,255,255,.8)}
.type .k,.type h1{position:relative;z-index:2}
.type .k{font-size:13px;font-weight:300;letter-spacing:.32em;color:var(--vio-d)}
.type h1{font-size:clamp(27px,8.4vw,44px);font-weight:800;line-height:1.2;letter-spacing:-.01em;margin-top:4px}
</style>
</head>
<body class="v9">
<div class="wrap">
<header><a class="hd" href="./v9.html"><img src="assets/icon.png" alt="" width="32" height="32"><span class="site">AIポートフォリオ</span></a><button type="button" class="cta" aria-haspopup="dialog">仕事の相談</button></header><div class="type"><div class="flow" aria-hidden="true"></div><p class="k">AIで作った</p><h1>ロゴ・ページ・アプリ</h1></div>
<p class="proto"><span class="note">試作版：作品データはサンプルです</span></p>
<section class="works"><h2>作品<small><span id="count">–</span>件</small></h2><div class="filters"><div class="row" id="catRow" aria-label="種類で絞り込む"></div></div><ul class="list" id="list"></ul>
<p id="empty">この種類の作品はまだありません。</p></section>
<section id="profile" class="prof"><h2>プロフィール</h2><p class="pn" id="pName"></p><p class="pr" id="pRole"></p><p class="pb" id="pBio"></p></section>
<section id="contact" class="ct"><h2>お問い合わせ</h2><p class="cl">ロゴ1点から、ページ・アプリ画面まで相談できます。</p><button type="button" class="btn" id="pContact" aria-haspopup="dialog">仕事の相談をする</button><p class="cn" id="pNote"></p></section>
<footer>AIポートフォリオ 試作 v9 ／ 作品データはサンプルです ／ <a href="board.html">見比べボードに戻る</a></footer>
</div>
<script>window.T={card:(it,i)=>`<li class="card${i===0?" first":""}"><span class="tl">${thumb(it)}</span><div class="b">${link(it,esc(it.title),"t")}<p class="d">${esc(it.desc)}</p>${tags(it)}</div></li>`};</script>
<script src="app.js"></script>
</body>
</html>
