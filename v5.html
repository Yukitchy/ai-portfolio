<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIポートフォリオ v5｜AIで作ったロゴ・ページ・アプリ</title>
<meta name="description" content="AIで設計・書き出ししたロゴ・ページ・アプリUIの実績集（試作v5：罫線と文字で見せる。番号＋作品名の行、サムネは右端に小さく）。">
<meta property="og:type" content="website">
<meta property="og:title" content="AIポートフォリオ v5｜AIで作ったロゴ・ページ・アプリ">
<meta property="og:description" content="ChatGPT・Claudeなどを使い分けて作ったデザイン実績。作品ごとに使用AIを記載。">
<meta property="og:url" content="https://yukitchy.github.io/ai-portfolio/v5.html">
<meta property="og:image" content="https://yukitchy.github.io/ai-portfolio/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon-ai.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon-ai.png">
<link rel="stylesheet" href="common.css">
<style>
header{border-bottom:1px solid var(--ink)}
.cta{background:none;color:var(--ink);border:1px solid var(--ink)}
h2{background:none;color:var(--ink);font-weight:300;letter-spacing:.24em;font-size:12px;padding:12px 12px 2px}
h2 small{letter-spacing:0}
.proto{padding:6px 12px 0}
.filters{padding:6px 12px;border-bottom:1px solid var(--ink)}
.row{gap:14px}
.chip{border:0;border-radius:0;background:none;color:var(--sub);padding:2px 0;font-weight:400}
.chip[aria-pressed=true]{background:none;color:var(--vio-d);font-weight:700;box-shadow:inset 0 -2px var(--vio)}
.list{counter-reset:n}
.card{display:flex;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:center;counter-increment:n}
.card::before{content:counter(n,decimal-leading-zero);font-size:12px;font-weight:300;color:var(--vio);flex:none;width:18px;font-variant-numeric:tabular-nums}
.card .b{min-width:0;flex:1}
.card .t{font-weight:600;font-size:14px}
.card .d{display:none}
.card .tl{flex:0 0 44px;width:44px;order:2}
.card .th{border-radius:2px}
.scope{background:none;padding:0 4px 0 0;color:var(--vio-d);font-weight:600}
.prof,.ct{padding:0 12px 14px}
.prof h2,.ct h2{border-top:1px solid var(--ink);margin:6px -12px 0;padding:12px 12px 6px}
.ct .btn{background:none;color:var(--ink);border:1px solid var(--ink)}
.card .ph{padding:2px}.card .ph span{display:none}.card .ph small{font-size:0;right:2px;bottom:2px;padding:0 3px}.card .ph small::after{content:"仮";font-size:10px}</style>
</head>
<body class="v5">
<div class="wrap">
<header><a class="hd" href="./v5.html"><img src="assets/icon.png" alt="" width="28" height="28"><span class="site">AIポートフォリオ</span></a><button type="button" class="cta" aria-haspopup="dialog">仕事の相談</button></header>
<p class="proto"><span class="note">試作版：作品データはサンプルです</span></p>
<section class="works"><h2>WORKS<small><span id="count">–</span>件</small></h2><div class="filters"><div class="row" id="catRow" aria-label="種類で絞り込む"></div></div><ul class="list" id="list"></ul>
<p id="empty">この種類の作品はまだありません。</p></section>
<section id="profile" class="prof"><h2>プロフィール</h2><p class="pn" id="pName"></p><p class="pr" id="pRole"></p><p class="pb" id="pBio"></p></section>
<section id="contact" class="ct"><h2>お問い合わせ</h2><p class="cl">ロゴ1点から、ページ・アプリ画面まで相談できます。</p><button type="button" class="btn" id="pContact" aria-haspopup="dialog">仕事の相談をする</button><p class="cn" id="pNote"></p></section>
<footer>AIポートフォリオ 試作 v5 ／ 作品データはサンプルです ／ <a href="board.html">見比べボードに戻る</a></footer>
</div>
<script>window.T={card:(it,i)=>`<li class="card${i===0?" first":""}"><span class="tl">${thumb(it)}</span><div class="b">${link(it,esc(it.title),"t")}<p class="d">${esc(it.desc)}</p>${tags(it)}</div></li>`};</script>
<script src="app.js"></script>
</body>
</html>
