<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIポートフォリオ v2｜AIで作ったロゴ・ページ・アプリ</title>
<meta name="description" content="AIで設計・書き出ししたロゴ・ページ・アプリUIの実績集（試作v2：サムネ少し大きめの2列。行リストとグリッドの中間）。">
<meta property="og:type" content="website">
<meta property="og:title" content="AIポートフォリオ v2｜AIで作ったロゴ・ページ・アプリ">
<meta property="og:description" content="ChatGPT・Claudeなどを使い分けて作ったデザイン実績。作品ごとに使用AIを記載。">
<meta property="og:url" content="https://yukitchy.github.io/ai-portfolio/v2.html">
<meta property="og:image" content="https://yukitchy.github.io/ai-portfolio/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="common.css">
<style>
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 8px;padding:8px 10px}
@media(min-width:600px){.list{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{min-width:0}
.card .th{border-radius:4px;border:1px solid var(--line)}
.card .ph span{font-size:13px;white-space:normal;-webkit-line-clamp:2;display:-webkit-box}
.card .t{margin-top:4px}
.card .tags{margin-top:3px}
</style>
</head>
<body class="v2">
<div class="wrap">
<header><a class="hd" href="./v2.html"><img src="assets/icon.png" alt="" width="32" height="32"><span class="site">AIポートフォリオ</span></a><a class="cta" href="#contact">仕事の相談</a></header>
<p class="proto"><span class="note">試作版：作品データはサンプルです</span></p>
<section class="works"><h2>作品<small><span id="count">–</span>件</small></h2><div class="filters"><div class="row" id="catRow" aria-label="種類で絞り込む"></div></div><ul class="list" id="list"></ul>
<p id="empty">この種類の作品はまだありません。</p></section>
<section id="profile" class="prof"><h2>プロフィール</h2><p class="pn" id="pName"></p><p class="pr" id="pRole"></p><p class="pb" id="pBio"></p></section>
<section id="contact" class="ct"><h2>お問い合わせ</h2><p class="cl">ロゴ1点から、ページ・アプリ画面まで相談できます。</p><a class="btn" id="pContact" href="#contact">仕事の相談をする</a><p class="cn" id="pNote"></p></section>
<footer>AIポートフォリオ 試作 v2 ／ 作品データはサンプルです ／ <a href="board.html">見比べボードに戻る</a></footer>
</div>
<script>window.T={card:it=>`<li class="card"><span class="tl">${thumb(it)}</span>${link(it,esc(it.title),"t")}${tags(it)}</li>`};</script>
<script src="app.js"></script>
</body>
</html>
