<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIポートフォリオ v10｜AIで作ったロゴ・ページ・アプリ</title>
<meta name="description" content="AIで設計・書き出ししたロゴ・ページ・アプリUIの実績集（試作v10：流れは控えめ。余白・区切り・タグの見せ方を磨いたリスト）。">
<meta property="og:type" content="website">
<meta property="og:title" content="AIポートフォリオ v10｜AIで作ったロゴ・ページ・アプリ">
<meta property="og:description" content="ChatGPT・Claudeなどを使い分けて作ったデザイン実績。作品ごとに使用AIを記載。">
<meta property="og:url" content="https://yukitchy.github.io/ai-portfolio/v10.html">
<meta property="og:image" content="https://yukitchy.github.io/ai-portfolio/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="common.css">
<style>
.card{display:flex;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);align-items:center}
.card .tl{flex:0 0 80px;width:80px}
.card .th{border-radius:3px;border:1px solid var(--line)}
.card .b{min-width:0;flex:1}

.mini{--w:56px;--g:4px;--dur:140s;padding:5px 0}
.proto{padding:6px 14px 0}
h2{background:none;color:var(--ink);font-size:15px;padding:14px 14px 4px}
h2 small{font-weight:400}
.filters{padding:6px 14px 8px;border-bottom:0}
.chip{border-color:#d9d4e3;padding:3px 12px}
.card{gap:12px;padding:12px 14px;border-bottom:0}
.card+.card::before{content:"";position:absolute;top:0;left:110px;right:14px;border-top:1px solid var(--line)}
.card .tl{flex-basis:84px;width:84px}
.card .th{border-radius:4px;border:0;box-shadow:0 0 0 1px var(--line)}
.card .t{font-size:14px}
.tags{gap:4px;margin-top:5px}
.card:hover{background:#faf8fd}
.prof,.ct{padding-top:6px}
.prof p,.ct p{padding:0 14px}.btn{margin:0 14px}
footer{padding:16px 14px 32px}
</style>
</head>
<body class="v10">
<div class="wrap">
<header><a class="hd" href="./v10.html"><img src="assets/icon.png" alt="" width="32" height="32"><span class="site">AIポートフォリオ</span></a><a class="cta" href="#contact">仕事の相談</a></header><div class="flow mini" aria-hidden="true"></div>
<p class="proto"><span class="note">試作版：作品データはサンプルです</span></p>
<section class="works"><h2>作品<small><span id="count">–</span>件</small></h2><div class="filters"><div class="row" id="catRow" aria-label="種類で絞り込む"></div></div><ul class="list" id="list"></ul>
<p id="empty">この種類の作品はまだありません。</p></section>
<section id="profile" class="prof"><h2>プロフィール</h2><p class="pn" id="pName"></p><p class="pr" id="pRole"></p><p class="pb" id="pBio"></p></section>
<section id="contact" class="ct"><h2>お問い合わせ</h2><p class="cl">ロゴ1点から、ページ・アプリ画面まで相談できます。</p><a class="btn" id="pContact" href="#contact">仕事の相談をする</a><p class="cn" id="pNote"></p></section>
<footer>AIポートフォリオ 試作 v10 ／ 作品データはサンプルです ／ <a href="./">見比べボードに戻る</a></footer>
</div>
<script>window.T={card:(it,i)=>`<li class="card${i===0?" first":""}"><span class="tl">${thumb(it)}</span><div class="b">${link(it,esc(it.title),"t")}<p class="d">${esc(it.desc)}</p>${tags(it)}</div></li>`};</script>
<script src="app.js"></script>
</body>
</html>
